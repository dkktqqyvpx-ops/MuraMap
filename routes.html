<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A31">
<title>MuraMap — Бағыттар</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scan.css">
<link rel="stylesheet" href="css/routes.css">
</head>

<body class="body--routes">

<header class="header">
  <a class="brand" href="index.html" data-page="index.html">
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="22" height="22" fill="none" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M48 80C39 68 28 58 28 42A20 20 0 1 1 68 42C68 58 57 68 48 80ZM37 56V42A11 11 0 0 1 59 42V56Z"/>
        <path fill="currentColor" d="M44 56V51A4 4 0 0 1 52 51V56Z"/>
        <circle cx="48" cy="26" r="2.6" fill="#D9A441"/>
      </svg>
    </div>
    <span class="brand__name">MuraMap</span>
  </a>

  <div class="langmini" role="group" aria-label="Тіл / Язык">
    <button class="langmini__btn is-active" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
    <button class="langmini__btn" type="button" data-lang="ru" aria-pressed="false">РУС</button>
  </div>
</header>

<main class="routes" id="main">
  <section class="routes__list" id="routesList" hidden>
    <h1 class="routes__title" data-i18n="listTitle">Бағыттар</h1>
    <p class="routes__lead" data-i18n="listLead">Бірнеше киелі орынды бір жолға жинақтаған дайын бағыттар</p>
    <div class="cards" id="routeCards"></div>
  </section>

  <section class="route" id="routeDetail" hidden>
    <a class="route__back" href="routes.html" id="backLink" data-i18n="back">← Бағыттар</a>

    <h1 class="route__title" id="routeTitle"></h1>
    <p class="route__summary" id="routeSummary"></p>

    <ul class="facts" id="routeFacts"></ul>

    <div class="route__intro" id="routeIntro"></div>

    <div class="route__map" id="routeMap"></div>
    <p class="route__note" id="routeNote"></p>

    <div class="days" id="routeDays"></div>

    <section class="tips">
      <h2 class="tips__title" data-i18n="tipsTitle">Жолға дайындық</h2>
      <ul class="tips__list" id="routeTips"></ul>
    </section>
  </section>

  <p class="routes__status" id="routesStatus" role="status"></p>
</main>

<nav class="tabbar" aria-label="MuraMap">
  <a class="tab" href="guide.html" data-page="guide.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 4h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5.5A2 2 0 0 0 18 4h-5v16h5a2 2 0 0 1 2 2z"/></svg>
    <span data-i18n="navGuide">Гид</span>
  </a>
  <a class="tab" href="map.html" data-page="map.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span data-i18n="navMap">Карта</span>
  </a>
  <a class="tab" href="scan.html" data-page="scan.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><path d="M8 12h8"/></svg>
    <span data-i18n="navQr">QR</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/routes.js"></script>
</body>
</html>
