<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A31">
<meta name="description" content="MuraMap — Қазақстанның мұра, мәдениет және тарих орындарының картасы.">

<title>MuraMap</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
</head>

<body>

<a class="skip-link" href="#main" data-i18n="skip">Негізгі мазмұнға өту</a>

<header class="header">
  <div class="brand">
    <!-- Слот под логотип: замените div на <img src="assets/logo.svg" alt="MuraMap"> -->
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="22" height="22" fill="none" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M48 80C39 68 28 58 28 42A20 20 0 1 1 68 42C68 58 57 68 48 80ZM37 56V42A11 11 0 0 1 59 42V56Z"/>
        <path fill="currentColor" d="M44 56V51A4 4 0 0 1 52 51V56Z"/>
        <circle cx="48" cy="26" r="2.6" fill="#D9A441"/>
      </svg>
    </div>
    <span class="brand__name">MuraMap</span>
  </div>

  <button class="burger" id="menuButton" type="button"
          aria-controls="menu" aria-expanded="false" data-i18n-aria="menuOpen" aria-label="Мәзірді ашу">
    <span class="burger__line" aria-hidden="true"></span>
    <span class="burger__line" aria-hidden="true"></span>
    <span class="burger__line" aria-hidden="true"></span>
  </button>
</header>

<div class="scrim" id="scrim" hidden></div>

<aside class="drawer" id="menu" role="dialog" aria-modal="true" aria-labelledby="drawerTitle" hidden>
  <div class="drawer__top">
    <h2 class="drawer__title" id="drawerTitle" data-i18n="drawerTitle">Аккаунт және тіл</h2>
    <button class="drawer__close" id="menuClose" type="button" data-i18n-aria="menuClose" aria-label="Мәзірді жабу">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
        <path d="M6 6l12 12M18 6L6 18"/>
      </svg>
    </button>
  </div>

  <div class="drawer__body">
    <button class="btn btn--solid" type="button" data-action="sign-in" data-i18n="signIn">Кіру</button>
    <button class="btn btn--ghost" type="button" data-action="sign-up" data-i18n="signUp">Тіркелу</button>

    <div class="lang" role="group" aria-labelledby="langLabel">
      <span class="lang__label" id="langLabel" data-i18n="langLabel">Тіл</span>
      <div class="lang__switch">
        <button class="lang__btn is-active" type="button" data-lang="kk" aria-pressed="true">Қазақша</button>
        <button class="lang__btn" type="button" data-lang="ru" aria-pressed="false">Русский</button>
        <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">English</button>
      </div>
    </div>
  </div>
</aside>

<main class="main" id="main">
  <section class="hero">

    <h1 class="hero__title">
      <span>Mura</span>
      <span>Madeniet</span>
      <span>Tarih</span>
    </h1>

    <p class="hero__lead" data-i18n="heroLead">Қазақстанның киелі орындары бір картада</p>

    <figure class="hero__figure">
      <img class="hero__img" id="heroImage"
           src="assets/hero.jpg"
           width="1600" height="800"
           alt="Қазақстанның тарихи ескерткіші" data-i18n-alt="heroAlt">
      <div class="hero__fallback" id="heroFallback" hidden data-i18n="heroFallback">Киелі мұра</div>
    </figure>

    <button class="btn btn--map" id="openMap" type="button" data-i18n="openMap">Картаны ашу</button>

  </section>
</main>

<nav class="tabbar" aria-label="MuraMap">
  <button class="tab" type="button" data-tab="guide">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M4 5.5A2 2 0 0 1 6 4h5v16H6a2 2 0 0 0-2 2z"/>
      <path d="M20 5.5A2 2 0 0 0 18 4h-5v16h5a2 2 0 0 1 2 2z"/>
    </svg>
    <span data-i18n="navGuide">Гид</span>
  </button>

  <button class="tab is-active" type="button" data-tab="map" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
      <path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/>
      <circle cx="12" cy="10" r="2.5"/>
    </svg>
    <span data-i18n="navMap">Карта</span>
  </button>

  <button class="tab" type="button" data-tab="study">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-4 9 4-9 4-9-4z"/><path d="M7 11v4c0 1.5 2.5 3 5 3s5-1.5 5-3v-4"/><path d="M21 9v5"/></svg>
    <span data-i18n="navStudy">Оқу</span>
  </button>

  <button class="tab" type="button" data-tab="qr">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true">
      <path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/>
      <path d="M8 12h8"/>
    </svg>
    <span data-i18n="navQr">QR</span>
  </button>
</nav>

<script src="js/main.js"></script>
</body>
</html>
