<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A31">
<title>MuraMap — QR</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">

<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/scan.css">
</head>

<body>

<a class="skip-link" href="#main" data-i18n="skip">Негізгі мазмұнға өту</a>

<header class="header">
  <a class="brand" href="index.html" data-page="index.html">
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 32 32" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round">
        <path d="M16 3 27 11v18H5V11z"/><path d="M16 29v-9" stroke-linecap="round"/>
      </svg>
    </div>
    <span class="brand__name">MuraMap</span>
  </a>

  <div class="langmini" role="group" aria-label="Тіл / Язык">
    <button class="langmini__btn is-active" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
    <button class="langmini__btn" type="button" data-lang="ru" aria-pressed="false">РУС</button>
  </div>
</header>

<main class="scan" id="main">
  <h1 class="scan__title" data-i18n="title">QR сканер</h1>
  <p class="scan__lead" data-i18n="lead">Камераны нысан жанындағы QR кодқа бағыттаңыз</p>

  <!-- Видоискатель. Библиотека сама вставит видео в #reader -->
  <div class="viewfinder" id="frame" data-state="idle">
    <div class="viewfinder__video" id="reader"></div>

    <div class="viewfinder__idle" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="64" height="64" fill="none" stroke="currentColor" stroke-width="2.2">
        <rect x="8" y="8" width="12" height="12" rx="1.5"/>
        <rect x="28" y="8" width="12" height="12" rx="1.5"/>
        <rect x="8" y="28" width="12" height="12" rx="1.5"/>
        <path d="M28 28h5v5M40 28v12h-7M28 36v4" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>

    <span class="viewfinder__corner viewfinder__corner--tl" aria-hidden="true"></span>
    <span class="viewfinder__corner viewfinder__corner--tr" aria-hidden="true"></span>
    <span class="viewfinder__corner viewfinder__corner--bl" aria-hidden="true"></span>
    <span class="viewfinder__corner viewfinder__corner--br" aria-hidden="true"></span>
    <span class="viewfinder__line" aria-hidden="true"></span>
  </div>

  <p class="scan__status" id="scanStatus" role="status" aria-live="polite"></p>

  <div class="scan__actions">
    <button class="btn btn--map" id="scanToggle" type="button">Камераны қосу</button>

    <label class="btn btn--ghost scan__photo">
      <input class="visually-hidden" id="photoInput" type="file" accept="image/*">
      <span data-i18n="fromPhoto">Суреттен оқу</span>
    </label>
  </div>

  <form class="manual" id="manualForm" novalidate>
    <label class="manual__label" for="manualInput" data-i18n="manualLabel">Немесе нысан кодын енгізіңіз</label>
    <div class="manual__row">
      <input class="manual__input" id="manualInput" name="code" type="text"
             autocomplete="off" autocapitalize="characters" spellcheck="false"
             placeholder="MURA-001">
      <button class="btn btn--ghost manual__btn" type="submit" data-i18n="open">Ашу</button>
    </div>
    <p class="manual__hint" data-i18n="manualHint">Код табличкадағы QR астында жазылған</p>
  </form>
</main>

<nav class="tabbar" aria-label="MuraMap">
  <a class="tab" href="guide.html" data-page="guide.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 4h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5.5A2 2 0 0 0 18 4h-5v16h5a2 2 0 0 1 2 2z"/></svg>
    <span data-i18n="navGuide">Гид</span>
  </a>
  <a class="tab" href="map.html" data-page="map.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span data-i18n="navMap">Карта</span>
  </a>
  <a class="tab is-active" href="scan.html" data-page="scan.html" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><path d="M8 12h8"/></svg>
    <span data-i18n="navQr">QR</span>
  </a>
</nav>

<!-- Библиотека распознавания QR. Для приложения позже скачайте файл в js/vendor/ -->
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script src="js/config.js"></script>
<script src="js/mura-qr.js"></script>
<script src="js/scan.js"></script>
</body>
</html>
