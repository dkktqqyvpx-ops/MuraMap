<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A31">
<title>MuraMap — офлайн</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="css/style.css">
<style>
  .offline {
    min-height: 100dvh;
    display: grid;
    align-content: center;
    justify-items: center;
    gap: 14px;
    padding: 24px;
    text-align: center;
  }
  .offline__icon { color: var(--limestone-2); }
  .offline__title { margin: 0; font-family: var(--serif); font-size: 26px; }
  .offline__text { margin: 0; max-width: 34ch; color: var(--limestone-2); font-size: 15px; }
  .offline__links { display: grid; gap: 8px; width: 100%; max-width: 280px; margin-top: 8px; }
</style>
</head>
<body>
<main class="offline">
  <svg class="offline__icon" viewBox="0 0 24 24" width="56" height="56" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" aria-hidden="true">
    <path d="M3 3l18 18"/><path d="M5 12.5a10 10 0 0 1 4-2.4M2 8.8A15 15 0 0 1 8 5.4M16 5.9a15 15 0 0 1 6 2.9M15.5 10.4a10 10 0 0 1 3.5 2.1M9 16a5 5 0 0 1 6 0"/><circle cx="12" cy="20" r="1"/>
  </svg>
  <h1 class="offline__title">Интернет жоқ</h1>
  <p class="offline__text">Бұл бет әлі сақталмаған. Карта мен сақталған нысандарды офлайн режимде де ашуға болады.</p>
  <div class="offline__links">
    <a class="btn btn--map" href="map.html">Картаны ашу</a>
    <a class="btn btn--ghost" href="index.html">Басты бет</a>
  </div>
</main>
</body>
</html>
