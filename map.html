<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0B2A31">
<title>MuraMap — карта</title>

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;700&family=Noto+Serif:wght@500;700&display=swap&subset=cyrillic,cyrillic-ext,latin" rel="stylesheet">

<link href="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/map.css">
</head>

<body class="body--map">

<header class="header">
  <a class="brand" href="index.html">
    <div class="brand__mark" aria-hidden="true">
      <svg viewBox="0 0 96 96" width="22" height="22" fill="none" aria-hidden="true">
        <path fill="currentColor" fill-rule="evenodd" d="M48 80C39 68 28 58 28 42A20 20 0 1 1 68 42C68 58 57 68 48 80ZM37 56V42A11 11 0 0 1 59 42V56Z"/>
        <path fill="currentColor" d="M44 56V51A4 4 0 0 1 52 51V56Z"/>
        <circle cx="48" cy="26" r="2.6" fill="#D9A441"/>
      </svg>
    </div>
    <span class="brand__name">MuraMap</span>
  </a>

  <div class="langmini" role="group" aria-label="Тіл / Язык">
    <button class="langmini__btn is-active" type="button" data-lang="kk" aria-pressed="true">ҚАЗ</button>
    <button class="langmini__btn" type="button" data-lang="ru" aria-pressed="false">РУС</button>
  </div>
</header>

<div class="filters" id="filters" role="group" aria-label="Фильтр">
  <button class="chip is-active" type="button" data-type="all" data-i18n="fAll">Барлығы</button>
  <button class="chip" type="button" data-type="mausoleum" data-i18n="fMausoleum">Кесене</button>
  <button class="chip" type="button" data-type="underground_mosque" data-i18n="fMosque">Жер асты мешіті</button>
  <button class="chip" type="button" data-type="necropolis" data-i18n="fNecropolis">Қорым</button>
</div>

<div id="map" class="map" aria-label="Карта сакральных объектов"></div>

<p class="map-status" id="mapStatus" hidden></p>

<section class="sheet" id="sheet" hidden aria-live="polite">
  <button class="sheet__close" id="sheetClose" type="button" aria-label="Жабу">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
  </button>

  <img class="sheet__photo" id="sheetPhoto" src="" alt="">

  <div class="sheet__body">
    <p class="sheet__meta" id="sheetMeta"></p>
    <h2 class="sheet__title" id="sheetTitle"></h2>
    <p class="sheet__region" id="sheetRegion"></p>

    <div class="sheet__text" id="sheetText"></div>

    <p class="sheet__credit" id="sheetCredit"></p>

    <div class="sheet__actions">
      <a class="btn btn--map" id="sheetRoute" href="#" target="_blank" rel="noopener" data-i18n="route">Бағыт салу</a>
      <button class="btn btn--ghost" id="sheetGuide" type="button" data-i18n="askGuide">Гидтен сұрау</button>
    </div>
  </div>
</section>

<nav class="tabbar" aria-label="MuraMap">
  <a class="tab" href="guide.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M4 5.5A2 2 0 0 1 6 4h5v16H6a2 2 0 0 0-2 2z"/><path d="M20 5.5A2 2 0 0 0 18 4h-5v16h5a2 2 0 0 1 2 2z"/></svg>
    <span data-i18n="navGuide">Гид</span>
  </a>
  <a class="tab is-active" href="map.html" aria-current="page">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true"><path d="M12 21s7-6.1 7-11a7 7 0 1 0-14 0c0 4.9 7 11 7 11z"/><circle cx="12" cy="10" r="2.5"/></svg>
    <span data-i18n="navMap">Карта</span>
  </a>
  <a class="tab" href="scan.html">
    <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" aria-hidden="true"><path d="M4 9V5h4M20 9V5h-4M4 15v4h4M20 15v4h-4"/><path d="M8 12h8"/></svg>
    <span data-i18n="navQr">QR</span>
  </a>
</nav>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<script src="js/map.js"></script>
</body>
</html>
